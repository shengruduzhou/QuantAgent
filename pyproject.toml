[project]
name = "quantagent"
version = "0.5.0"
description = "Governed A-share quantitative research, backtesting, and paper-trading platform."
readme = "README.md"
requires-python = ">=3.11"
# Dependency policy (docs/OPERATIONS.md §0):
# - Ranges here are what the code supports. Libraries whose major releases have
#   broken this code base or its API surface (numpy, pandas, polars, pydantic)
#   carry a next-major ceiling, so a fresh install never resolves to an
#   untested major.
# - CI installs with `-c requirements/ci-constraints.txt` (exact versions,
#   regenerated by scripts/refresh_ci_constraints.sh only after the full suite
#   passes on them). The weekly Dependency Drift workflow tests the newest
#   versions inside these ranges without the constraints.
# - tests/test_declared_dependencies.py fails in any environment (CI or the
#   server venv) whose installed versions fall outside these ranges.
dependencies = [
  # The server venv runs numpy 2.4.x; numba there (via vectorbt) caps numpy
  # below 2.5. The old <2.3 cap was already violated by the server.
  "numpy>=1.26,<2.5",
  "pandas>=2.2,<3",
  # min_samples (the renamed min_periods) arrived in 1.21; 2.0 removed the old
  # name, which is what broke CI from 2026-10-09.
  "polars>=1.21,<3",
  "pyarrow>=16.0",
  "scipy>=1.13",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0",
  "typer>=0.12",
  # pandas DataFrame.to_markdown() needs it (v8 result tables, stratified-IC
  # reports); it is never imported directly, so import scans miss it.
  "tabulate>=0.9",
  # Unconditional production import in quantagent.data.ashare.http, the shared
  # paced/retrying transport every public A-share adapter uses. It is core, not
  # optional: without it the data foundation cannot import at all. Omitting it
  # here is what broke CI collection in a clean environment while passing on
  # developer machines that had it installed transitively.
  "requests>=2.31,<3",
  # Dataset-build memory preflight imports psutil inside the governed training
  # CLI. This is a safety dependency, not merely a web extra: without it the
  # full-universe command cannot refuse an OOM-sized build before execution.
  "psutil>=5.9",
]

[project.optional-dependencies]
data = [
  # AKShare wraps fast-changing upstream websites and provider-side unit
  # normalization is part of the research data contract. Keep the runtime on
  # the exact release exercised by Market Data Smoke; version bumps require a
  # source/schema/unit audit before this pin moves.
  "akshare==1.18.84",
  "tushare",
  # ENG_ST30 risk-warning register: text of cninfo announcement PDFs.
  "pypdf>=5,<7",
  # Real public A-share daily/minute history provider used by the research-only
  # factor cycle. Production certification remains governed by router integrity;
  # installing a package is not evidence of PIT/production quality.
  "baostock>=0.9.3",
  # TickFlow serves ~94% of the certified U0 bars (scripts/u0_*); the fresh-
  # blind cron decrypts its vendor token with cryptography.
  "tickflow",
  "cryptography>=42",
  "python-dotenv>=1.0",
]
training = [
  "torch>=2.3",
  "scikit-learn>=1.5",
  # The governed nonlinear comparison (audit-nonlinear-factors) and
  # train-alpha-v7 --model lightgbm/xgboost/catboost import these lazily; a
  # missing one fails loud rather than silently downgrading.
  "lightgbm>=4.0",
  "xgboost>=2.0",
  "catboost>=1.2",
  "optuna>=3.6",
  "deap>=1.4",
  "joblib>=1.3",
]
rl = [
  # Research harness only: the pre-registered RL verdict is DO NOT ENABLE.
  "gymnasium>=1.0,<2",
  "stable-baselines3>=2.3",
]
research = [
  "pyqlib>=0.9.7,<0.10",
  "matplotlib>=3.8",
]
optimization = [
  "cvxpy>=1.4",
]
web = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
]
test = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "scikit-learn>=1.5",
  # Reward-clock and T+1/T+2 execution tests instantiate the real RL
  # environments.  Declaring gymnasium here keeps a clean CI runner from
  # silently skipping (or failing before) the executable-semantics contract.
  "gymnasium>=1.0,<2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
]
all = [
  "akshare==1.18.84",
  "tushare",
  "baostock>=0.9.3",
  "tickflow",
  "cryptography>=42",
  "python-dotenv>=1.0",
  "torch>=2.3",
  "scikit-learn>=1.5",
  "lightgbm>=4.0",
  "xgboost>=2.0",
  "catboost>=1.2",
  "optuna>=3.6",
  "deap>=1.4",
  "joblib>=1.3",
  "stable-baselines3>=2.3",
  "pyqlib>=0.9.7,<0.10",
  "matplotlib>=3.8",
  "cvxpy>=1.4",
  "gymnasium>=1.0,<2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
]

[project.scripts]
quantagent = "quantagent.cli:app"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
