[project]
name = "quantagent"
version = "0.4.1"
description = "Governed A-share quantitative research, backtesting, and paper-trading platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<2.3",
  "pandas>=2.2,<3",
  "polars>=1.0",
  "pyarrow>=16.0",
  "scipy>=1.13",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "tabulate>=0.9",
  # Unconditional production import in quantagent.data.ashare.http, the shared
  # paced/retrying transport every public A-share adapter uses. It is core, not
  # optional: without it the data foundation cannot import at all. Omitting it
  # here is what broke CI collection in a clean environment while passing on
  # developer machines that had it installed transitively.
  "requests>=2.31,<3",
  # Dataset-build memory preflight imports psutil inside the governed training
  # CLI. This is a safety dependency, not merely a web extra: without it the
  # full-universe command cannot refuse an OOM-sized build before execution.
  "psutil>=5.9",
]

[project.optional-dependencies]
data = [
  # AKShare wraps fast-changing upstream websites. Bind the compatibility floor
  # to the version exercised by QuantAgent's live source smoke instead of letting
  # an arbitrary old install silently change endpoint schemas/units. The minor
  # cap forces an explicit audit before a future compatibility-breaking line.
  "akshare>=1.18.84,<1.19",
  "tushare",
  # Real public A-share daily/minute history provider used by the research-only
  # factor cycle. Production certification remains governed by router integrity;
  # installing a package is not evidence of PIT/production quality.
  "baostock>=0.9.3",
]
training = [
  "torch>=2.3",
  "transformers>=4.43",
  "scikit-learn>=1.5",
]
research = [
  "pyqlib>=0.9.7,<0.10",
  "vectorbt>=0.26",
]
optimization = [
  "cvxpy>=1.4",
]
web = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
]
test = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "scikit-learn>=1.5",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
]
all = [
  "akshare>=1.18.84,<1.19",
  "tushare",
  "baostock>=0.9.3",
  "torch>=2.3",
  "transformers>=4.43",
  "scikit-learn>=1.5",
  "pyqlib>=0.9.7,<0.10",
  "vectorbt>=0.26",
  "cvxpy>=1.4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
]

[project.scripts]
quantagent = "quantagent.cli:app"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
