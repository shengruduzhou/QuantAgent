# Workflow actions are pinned to full commit SHAs (supply-chain hardening);
# Dependabot keeps those pins current. Python dependencies are governed by
# requirements/ci-constraints.txt + the weekly Dependency Drift workflow instead.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
