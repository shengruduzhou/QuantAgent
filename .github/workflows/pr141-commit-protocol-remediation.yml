name: PR141 Pending Commit Protocol Remediation

on:
  push:
    branches:
      - agent/account-aware-target-construction

permissions:
  contents: write

jobs:
  remediate:
    if: "github.event.head_commit.message == 'chore(ci): execute pending commit protocol remediation'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: agent/account-aware-target-construction
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply deterministic reviewed patch
        run: python scripts/pr141_commit_protocol_patch_v2.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -e ".[test]"
      - name: Compile and focused adversarial regressions
        run: |
          python -m compileall -q src
          python -m pytest \
            tests/paper/test_continuous_pending_execution.py \
            tests/paper/test_daily_loop_pending_execution.py \
            tests/paper/test_daily_loop_prior_execution_gate.py \
            tests/paper/test_daily_decision_and_legacy_binding.py \
            tests/paper/test_continuous_execution_account_lock.py \
            tests/portfolio/test_position_age_tracker_account_reconciliation.py \
            tests/test_v7_target_initial_weights.py \
            tests/test_v7_target_cvxpy_dropped_holding.py \
            -q
          git diff --check
      - name: Commit validated business and regression changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/quantagent/paper/pending_signal.py \
            src/quantagent/paper/daily_loop.py \
            src/quantagent/paper/continuous_execution.py \
            src/quantagent/portfolio/position_age_tracker.py \
            tests/paper/test_continuous_pending_execution.py \
            tests/paper/test_daily_loop_pending_execution.py \
            tests/paper/test_daily_loop_prior_execution_gate.py \
            tests/portfolio/test_position_age_tracker_account_reconciliation.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(paper): commit pending targets before execution"
          git push origin HEAD:agent/account-aware-target-construction
