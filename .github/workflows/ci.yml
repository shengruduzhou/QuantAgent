name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  remediate-pr141-edge:
    if: github.event_name == 'push' && github.event.head_commit.message == 'chore(ci): run deterministic PR141 edge patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: agent/account-aware-target-construction
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Apply deterministic reviewed patch
        run: python scripts/pr141_edge_patch.py
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -e ".[test]"
      - name: Compile and focused regressions
        run: |
          python -m compileall -q src
          python -m pytest \
            tests/paper/test_continuous_execution_account_lock.py \
            tests/paper/test_daily_decision_and_legacy_binding.py \
            tests/paper/test_daily_loop_pending_execution.py \
            tests/portfolio/test_position_age_tracker_account_reconciliation.py \
            tests/test_v7_target_initial_weights.py \
            tests/paper/test_daily_loop_prior_execution_gate.py \
            -q
          git diff --check
      - name: Commit validated business and regression changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/quantagent/paper/account_lock.py \
            src/quantagent/paper/continuous_execution.py \
            src/quantagent/paper/daily_loop.py \
            src/quantagent/portfolio/position_age_tracker.py \
            src/quantagent/portfolio/v7_target_weights.py \
            tests/paper/test_continuous_execution_account_lock.py \
            tests/paper/test_daily_decision_and_legacy_binding.py \
            tests/paper/test_daily_loop_pending_execution.py \
            tests/portfolio/test_position_age_tracker_account_reconciliation.py \
            tests/test_v7_target_initial_weights.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(paper): close account safety edge cases"
          git push origin HEAD:agent/account-aware-target-construction

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip wheel setuptools
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile
        run: python -m compileall -q src services scripts
      - name: Declared-dependency audit
        run: python -m pytest tests/test_declared_dependencies.py -q
      - name: Verify collection in the installed environment
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/ -q --collect-only 2>&1 | tee pytest-collect.log
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/ -q --junitxml=pytest-results.xml 2>&1 | tee pytest.log
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: |
            pytest-collect.log
            pytest-results.xml
            pytest.log
          if-no-files-found: warn
          retention-days: 14

  optimization-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install optimization dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -e ".[test,optimization]"
      - name: Explicit CVXPY account-state/turnover regressions
        run: |
          python -m pytest \
            tests/test_v7_target_cvxpy_dropped_holding.py \
            tests/test_v7_target_initial_weights.py \
            -q

  # QMT/MiniQMT is a Windows-only client requiring a funded broker account, so
  # it cannot be genuinely exercised on a hosted Ubuntu runner. This job runs
  # the portable production contracts and always records that limitation.
  qmt-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -e ".[test]"
      - name: QMT contract and mock tests
        run: |
          python -m pytest \
            tests/data/test_qmt_gateway.py \
            tests/data/test_market_data_providers.py \
            tests/execution/test_qmt_live_contract.py \
            tests/execution/test_order_manager_pretrade_risk.py \
            tests/execution/test_live_model_trust.py \
            -q
      - name: Record platform verdict
        if: always()
        shell: bash
        run: |
          echo "QMT live probe: NOT_RUN_PLATFORM (hosted runner is Linux; QMT/MiniQMT requires Windows + broker entitlement)" | tee qmt-platform-verdict.txt
      - name: Upload QMT platform verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qmt-platform-verdict
          path: qmt-platform-verdict.txt
          if-no-files-found: error
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/quant-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: apps/quant-ui/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log
      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-typecheck-diagnostics
          path: apps/quant-ui/typecheck.log
          if-no-files-found: error
          retention-days: 14
      - name: MonitorTable component tests
        shell: bash
        run: |
          set -o pipefail
          npm test -- --run src/components/MonitorTable.test.tsx 2>&1 | tee monitor-table-test.log
      - name: Upload MonitorTable diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-table-test-diagnostics
          path: apps/quant-ui/monitor-table-test.log
          if-no-files-found: error
          retention-days: 14
      - name: Workstation UX regression tests
        shell: bash
        run: |
          set -o pipefail
          npm test -- --run \
            src/App.test.tsx \
            src/components/CandlestickChart.test.tsx \
            src/pages/BacktestLabPage.test.tsx \
            src/pages/FactorCenterPage.test.tsx \
            src/pages/HelpCenterPage.test.tsx \
            src/pages/SettingsPage.test.tsx \
            src/pages/VnpyParityPage.test.tsx \
            2>&1 | tee workstation-ux-test.log
      - name: Upload workstation UX diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workstation-ux-test-diagnostics
          path: apps/quant-ui/workstation-ux-test.log
          if-no-files-found: error
          retention-days: 14
      - name: Unit and component tests
        shell: bash
        run: |
          set -o pipefail
          npm test -- --run 2>&1 | tee frontend-test.log
      - name: Upload frontend test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-diagnostics
          path: apps/quant-ui/frontend-test.log
          if-no-files-found: warn
          retention-days: 14
      - name: Production build
        shell: bash
        run: |
          set -o pipefail
          npm run build:vite 2>&1 | tee frontend-build.log
      - name: Upload frontend build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-diagnostics
          path: apps/quant-ui/frontend-build.log
          if-no-files-found: warn
          retention-days: 14
