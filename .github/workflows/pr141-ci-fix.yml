name: PR141 Exact-Head CI Remediation

on:
  push:
    branches:
      - agent/account-aware-target-construction
    paths:
      - .github/workflows/pr141-ci-fix.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/account-aware-target-construction
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply reviewed minimal fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def one(path, old, new):
              p=Path(path); t=p.read_text(encoding='utf-8'); c=t.count(old)
              if c != 1: raise SystemExit(f'{path}: anchor count={c}: {old[:80]!r}')
              p.write_text(t.replace(old,new,1),encoding='utf-8')

          # 1) Uncertainty is the strongest account-level blocker. Check it before
          # lower-assurance legacy lineage binding, then still require binding after
          # an explicit reconciliation succeeds.
          path='src/quantagent/paper/continuous_execution.py'
          old='''        terminal = terminals[0]\n        _verify_terminal_canonical_binding(\n            terminal=terminal,\n            legacy_binding=journal.legacy_binding(payload),\n            canonical_ledger_path=canonical_ledger_path,\n            expected_paper_account_identity_sha256=paper_account_identity_sha256,\n        )\n        if terminal.status != "execution_indeterminate":\n            continue\n        reconciliation = journal.reconciliation(payload)\n        if not _reconciliation_is_valid(\n            terminal=terminal,\n            reconciliation=reconciliation,\n            canonical_ledger_path=canonical_ledger_path,\n            paper_account_identity_sha256=paper_account_identity_sha256,\n        ):\n            raise ContinuousPaperExecutionBlocked(\n                "paper account has an unreconciled execution_indeterminate outcome; "\n                "explicit canonical/operational reconciliation is required before "\n                "any later signal can trade"\n            )\n'''
          new='''        terminal = terminals[0]\n        if terminal.status == "execution_indeterminate":\n            reconciliation = journal.reconciliation(payload)\n            if not _reconciliation_is_valid(\n                terminal=terminal,\n                reconciliation=reconciliation,\n                canonical_ledger_path=canonical_ledger_path,\n                paper_account_identity_sha256=paper_account_identity_sha256,\n            ):\n                raise ContinuousPaperExecutionBlocked(\n                    "paper account has an unreconciled execution_indeterminate outcome; "\n                    "explicit canonical/operational reconciliation is required before "\n                    "any later signal can trade"\n                )\n        _verify_terminal_canonical_binding(\n            terminal=terminal,\n            legacy_binding=journal.legacy_binding(payload),\n            canonical_ledger_path=canonical_ledger_path,\n            expected_paper_account_identity_sha256=paper_account_identity_sha256,\n        )\n'''
          one(path,old,new)

          # 2) A custom canonical account must not silently share the process-wide
          # default execution journal. None means derive a sibling journal; the
          # standard default canonical path therefore still derives the standard
          # runtime execution_journal.jsonl.
          path='src/quantagent/paper/daily_loop.py'
          one(path,
              '    execution_journal_path: str = field(default_factory=lambda: str(paper_runtime_paths().execution_journal))\n',
              '    execution_journal_path: str | None = None\n')
          p=Path(path); t=p.read_text(encoding='utf-8')
          anchor='''def _assert_current_signal_not_frozen(\n    config: DailyPaperLoopConfig,\n    as_of: str,\n) -> None:\n'''
          helper='''def _execution_journal_path(config: DailyPaperLoopConfig) -> str:\n    if config.execution_journal_path is not None:\n        return str(config.execution_journal_path)\n    return str(Path(config.canonical_ledger_path).with_name("execution_journal.jsonl"))\n\n\n'''+anchor
          if t.count(anchor)!=1: raise SystemExit('daily helper anchor mismatch')
          t=t.replace(anchor,helper,1)
          c=t.count('PendingExecutionJournal(config.execution_journal_path)')
          if c != 3: raise SystemExit(f'daily journal reference count={c}')
          t=t.replace('PendingExecutionJournal(config.execution_journal_path)', 'PendingExecutionJournal(_execution_journal_path(config))')
          # Same account-risk precedence in the daily target gate.
          old='''        terminal = terminals[0]\n        _assert_terminal_bound_to_account(\n            terminal=terminal,\n            legacy_binding=journal.legacy_binding(payload),\n            prefix_index=prefix_index,\n            paper_account_identity_sha256=paper_account_identity_sha256,\n        )\n        if terminal.status != "execution_indeterminate":\n            continue\n        reconciliation = journal.reconciliation(payload)\n        if not _valid_indeterminate_reconciliation(\n            terminal=terminal,\n            reconciliation=reconciliation,\n            prefix_index=prefix_index,\n            paper_account_identity_sha256=paper_account_identity_sha256,\n        ):\n            raise PaperAccountStateRefused(\n                "paper account has an unreconciled execution_indeterminate outcome; "\n                "explicit canonical/operational reconciliation is required before "\n                "a new target can freeze"\n            )\n'''
          new='''        terminal = terminals[0]\n        if terminal.status == "execution_indeterminate":\n            reconciliation = journal.reconciliation(payload)\n            if not _valid_indeterminate_reconciliation(\n                terminal=terminal,\n                reconciliation=reconciliation,\n                prefix_index=prefix_index,\n                paper_account_identity_sha256=paper_account_identity_sha256,\n            ):\n                raise PaperAccountStateRefused(\n                    "paper account has an unreconciled execution_indeterminate outcome; "\n                    "explicit canonical/operational reconciliation is required before "\n                    "a new target can freeze"\n                )\n        _assert_terminal_bound_to_account(\n            terminal=terminal,\n            legacy_binding=journal.legacy_binding(payload),\n            prefix_index=prefix_index,\n            paper_account_identity_sha256=paper_account_identity_sha256,\n        )\n'''
          if t.count(old)!=1: raise SystemExit('daily indeterminate-order anchor mismatch')
          p.write_text(t.replace(old,new,1),encoding='utf-8')

          # 3) Update the pre-binding regression: silently accepting legacy terminal
          # evidence is no longer valid after explicit migration was introduced.
          path='tests/paper/test_account_identity_review_regressions.py'
          p=Path(path); t=p.read_text(encoding='utf-8')
          t=t.replace(
              '    ContinuousPaperExecutionConfig,\n    execute_pending_for_session,\n',
              '    ContinuousPaperExecutionBlocked,\n    ContinuousPaperExecutionConfig,\n    execute_pending_for_session,\n',1)
          t=t.replace(
              'def test_terminal_legacy_signal_without_identity_lineage_does_not_block_new_runtime(tmp_path) -> None:',
              'def test_terminal_legacy_signal_without_identity_lineage_requires_explicit_binding(tmp_path) -> None:',1)
          old='''    result = execute_pending_for_session(\n        MONDAY,\n        market,\n        config=config,\n        authoritative_sessions=[FRIDAY, MONDAY],\n    )\n    assert result == []\n'''
          new='''    with pytest.raises(\n        ContinuousPaperExecutionBlocked,\n        match="append-only operator binding",\n    ):\n        execute_pending_for_session(\n            MONDAY,\n            market,\n            config=config,\n            authoritative_sessions=[FRIDAY, MONDAY],\n        )\n'''
          if t.count(old)!=1: raise SystemExit('legacy regression anchor mismatch')
          p.write_text(t.replace(old,new,1),encoding='utf-8')

          # 4) Keep the ordinary suite dependency-compatible with main. Exercise
          # optional CVXPY in an isolated contract job instead of changing the
          # backend of unrelated historical tests.
          path='.github/workflows/ci.yml'
          p=Path(path); t=p.read_text(encoding='utf-8')
          if t.count('python -m pip install -e ".[test,optimization]"') != 1:
              raise SystemExit('CI optimization install anchor mismatch')
          t=t.replace('python -m pip install -e ".[test,optimization]"','python -m pip install -e ".[test]"',1)
          marker='''  # QMT/MiniQMT is a Windows-only client requiring a funded broker account, so\n'''
          job='''  optimization-contract:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v6\n        with:\n          submodules: false\n      - name: Set up Python\n        uses: actions/setup-python@v6\n        with:\n          python-version: "3.12"\n          cache: "pip"\n      - name: Install optimization dependencies\n        run: |\n          python -m pip install --upgrade pip wheel setuptools\n          python -m pip install -e ".[test,optimization]"\n      - name: Explicit CVXPY account-state/turnover regressions\n        run: |\n          python -m pytest \\\n            tests/test_v7_target_cvxpy_dropped_holding.py \\\n            tests/test_v7_target_initial_weights.py \\\n            -q\n\n'''
          if t.count(marker)!=1: raise SystemExit('CI job insertion anchor mismatch')
          p.write_text(t.replace(marker,job+marker,1),encoding='utf-8')
          PY
      - name: Install and run focused regressions
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -e ".[test,optimization]"
          python -m compileall -q src/quantagent/paper
          python -m pytest \
            tests/paper/test_account_identity_review_regressions.py \
            tests/paper/test_canonical_prefix_receipt.py \
            tests/paper/test_daily_loop_pending_execution.py \
            tests/paper/test_daily_decision_and_legacy_binding.py \
            tests/test_v7_target_cvxpy_dropped_holding.py \
            tests/test_v7_target_initial_weights.py \
            -q
      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "quantagent-ci-remediator"
          git config user.email "actions@users.noreply.github.com"
          # Workflow-file mutation cannot be pushed by the Actions token. Commit
          # business/tests only; CI workflow is applied by the GitHub connector.
          git restore -- .github/workflows/ci.yml
          git add \
            src/quantagent/paper/continuous_execution.py \
            src/quantagent/paper/daily_loop.py \
            tests/paper/test_account_identity_review_regressions.py
          git diff --cached --check
          git commit -m "fix(paper): isolate journal and prioritize uncertainty gate"
          git push origin HEAD:agent/account-aware-target-construction
