name: PR141 Edge Remediation

on:
  push:
    branches:
      - agent/account-aware-target-construction

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.head_commit.message == 'chore(ci): stage PR141 edge remediation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: agent/account-aware-target-construction
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply reviewed edge fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/quantagent/paper/account_lock.py',
              '''def paper_account_lock_path(canonical_ledger_path: str | os.PathLike[str]) -> Path:\n    path = Path(canonical_ledger_path)\n    return path.with_name(f"{path.name}.account.lock")\n''',
              '''def paper_account_lock_path(canonical_ledger_path: str | os.PathLike[str]) -> Path:\n    # Lock identity must follow filesystem identity, not the caller's spelling\n    # of the path. ``strict=False`` still resolves existing symlink/junction\n    # components while allowing a first-run ledger file to be absent.\n    path = Path(canonical_ledger_path).resolve(strict=False)\n    return path.with_name(f"{path.name}.account.lock")\n''',
          )

          replace_once(
              'src/quantagent/paper/continuous_execution.py',
              '''    operational_positions = _position_quantities(operational_state.portfolio)\n    initial_cash = float(getattr(operational_state.portfolio, "initial_cash", 0.0))\n    operational_cash = float(operational_state.portfolio.cash)\n    has_operational_economics = bool(\n        operational_state.orders\n        or operational_state.fills\n        or operational_positions\n        or abs(operational_cash - initial_cash) > tolerance\n    )\n    if not has_operational_economics:\n        return\n\n    if abs(float(canonical_state.portfolio.cash) - operational_cash) > tolerance:\n''',
              '''    operational_positions = _position_quantities(operational_state.portfolio)\n    operational_initial_cash = float(\n        getattr(operational_state.portfolio, "initial_cash", 0.0)\n    )\n    operational_cash = float(operational_state.portfolio.cash)\n    has_operational_economics = bool(\n        operational_state.orders\n        or operational_state.fills\n        or operational_positions\n        or abs(operational_cash - operational_initial_cash) > tolerance\n    )\n\n    canonical_positions = _position_quantities(canonical_state.portfolio)\n    canonical_initial_cash = float(\n        getattr(canonical_state.portfolio, "initial_cash", 0.0)\n    )\n    canonical_cash = float(canonical_state.portfolio.cash)\n    has_canonical_economics = bool(\n        canonical_state.orders\n        or canonical_state.fills\n        or canonical_positions\n        or abs(canonical_cash - canonical_initial_cash) > tolerance\n    )\n    if not has_operational_economics:\n        if has_canonical_economics:\n            raise ContinuousPaperExecutionBlocked(\n                "operational paper ledger has no reconstructable economics while "\n                "the canonical ledger contains account history; refusing to claim "\n                "canonical/operational parity"\n            )\n        return\n\n    if abs(canonical_cash - operational_cash) > tolerance:\n''',
          )

          replace_once(
              'src/quantagent/paper/continuous_execution.py',
              '''    for payload, history in by_payload.items():\n        starts = [row for row in history if row.status == "execution_started"]\n        terminals = [row for row in history if row.status in TERMINAL_OUTCOMES]\n        if starts and not terminals:\n            raise ContinuousPaperExecutionBlocked(\n                "paper account has an unresolved execution_started record for "\n                f"{payload}; pending artifact presence is irrelevant. Explicit "\n                "account reconciliation is required before later signals can trade"\n            )\n        if len(terminals) > 1:\n            raise ContinuousPaperExecutionBlocked(\n                f"paper account has multiple terminal outcomes for {payload}"\n            )\n        if not terminals:\n            continue\n        terminal = terminals[0]\n        if terminal.status == "execution_indeterminate":\n            reconciliation = journal.reconciliation(payload)\n            if not _reconciliation_is_valid(\n                terminal=terminal,\n                reconciliation=reconciliation,\n                canonical_ledger_path=canonical_ledger_path,\n                paper_account_identity_sha256=paper_account_identity_sha256,\n            ):\n                raise ContinuousPaperExecutionBlocked(\n                    "paper account has an unreconciled execution_indeterminate outcome; "\n                    "explicit canonical/operational reconciliation is required before "\n                    "any later signal can trade"\n                )\n        _verify_terminal_canonical_binding(\n            terminal=terminal,\n            legacy_binding=journal.legacy_binding(payload),\n            canonical_ledger_path=canonical_ledger_path,\n            expected_paper_account_identity_sha256=paper_account_identity_sha256,\n        )\n''',
              '''    # Account uncertainty outranks lineage migration. Validate every\n    # lifecycle first so an older unbound legacy terminal cannot mask a later\n    # unreconciled indeterminate outcome merely because of journal insertion order.\n    terminals_by_payload: dict[str, object] = {}\n    for payload, history in by_payload.items():\n        starts = [row for row in history if row.status == "execution_started"]\n        terminals = [row for row in history if row.status in TERMINAL_OUTCOMES]\n        if starts and not terminals:\n            raise ContinuousPaperExecutionBlocked(\n                "paper account has an unresolved execution_started record for "\n                f"{payload}; pending artifact presence is irrelevant. Explicit "\n                "account reconciliation is required before later signals can trade"\n            )\n        if len(terminals) > 1:\n            raise ContinuousPaperExecutionBlocked(\n                f"paper account has multiple terminal outcomes for {payload}"\n            )\n        if not terminals:\n            continue\n        terminal = terminals[0]\n        terminals_by_payload[payload] = terminal\n        if terminal.status == "execution_indeterminate":\n            reconciliation = journal.reconciliation(payload)\n            if not _reconciliation_is_valid(\n                terminal=terminal,\n                reconciliation=reconciliation,\n                canonical_ledger_path=canonical_ledger_path,\n                paper_account_identity_sha256=paper_account_identity_sha256,\n            ):\n                raise ContinuousPaperExecutionBlocked(\n                    "paper account has an unreconciled execution_indeterminate outcome; "\n                    "explicit canonical/operational reconciliation is required before "\n                    "any later signal can trade"\n                )\n\n    for payload, terminal in terminals_by_payload.items():\n        _verify_terminal_canonical_binding(\n            terminal=terminal,\n            legacy_binding=journal.legacy_binding(payload),\n            canonical_ledger_path=canonical_ledger_path,\n            expected_paper_account_identity_sha256=paper_account_identity_sha256,\n        )\n''',
          )

          replace_once(
              'src/quantagent/paper/daily_loop.py',
              '''def _execution_journal_path(config: DailyPaperLoopConfig) -> str:\n    if config.execution_journal_path is not None:\n        return str(config.execution_journal_path)\n    return str(Path(config.canonical_ledger_path).with_name("execution_journal.jsonl"))\n''',
              '''def _execution_journal_path(config: DailyPaperLoopConfig) -> str:\n    if config.execution_journal_path is not None:\n        return str(config.execution_journal_path)\n\n    canonical = Path(config.canonical_ledger_path)\n    runtime = paper_runtime_paths()\n    if canonical.resolve(strict=False) == runtime.canonical_ledger.resolve(strict=False):\n        return str(runtime.execution_journal)\n\n    # A custom canonical account must never share the default account's journal\n    # merely because both ledgers live in the same directory.\n    suffix = canonical.suffix or ".jsonl"\n    stem = canonical.stem if canonical.suffix else canonical.name\n    return str(canonical.with_name(f"{stem}.execution_journal{suffix}"))\n''',
          )

          replace_once(
              'src/quantagent/paper/daily_loop.py',
              '''    for payload, history in by_payload.items():\n        starts = [row for row in history if row.status == "execution_started"]\n        terminals = [row for row in history if row.status in TERMINAL_OUTCOMES]\n        if starts and not terminals:\n            raise PaperAccountStateRefused(\n                "paper account has an unresolved execution_started record for "\n                f"{payload}; pending artifact presence is irrelevant. Explicit "\n                "account reconciliation is required before a new target can freeze"\n            )\n        if len(terminals) > 1:\n            raise PaperAccountStateRefused(\n                f"paper account has multiple terminal outcomes for {payload}"\n            )\n        if not terminals:\n            continue\n        terminal = terminals[0]\n        if terminal.status == "execution_indeterminate":\n            reconciliation = journal.reconciliation(payload)\n            if not _valid_indeterminate_reconciliation(\n                terminal=terminal,\n                reconciliation=reconciliation,\n                prefix_index=prefix_index,\n                paper_account_identity_sha256=paper_account_identity_sha256,\n            ):\n                raise PaperAccountStateRefused(\n                    "paper account has an unreconciled execution_indeterminate outcome; "\n                    "explicit canonical/operational reconciliation is required before "\n                    "a new target can freeze"\n                )\n        _assert_terminal_bound_to_account(\n            terminal=terminal,\n            legacy_binding=journal.legacy_binding(payload),\n            prefix_index=prefix_index,\n            paper_account_identity_sha256=paper_account_identity_sha256,\n        )\n''',
              '''    # First resolve account-wide economic uncertainty for every payload.\n    # Only after that pre-pass may lower-priority legacy lineage migration be\n    # evaluated, so journal insertion order cannot hide an indeterminate account.\n    terminals_by_payload: dict[str, object] = {}\n    for payload, history in by_payload.items():\n        starts = [row for row in history if row.status == "execution_started"]\n        terminals = [row for row in history if row.status in TERMINAL_OUTCOMES]\n        if starts and not terminals:\n            raise PaperAccountStateRefused(\n                "paper account has an unresolved execution_started record for "\n                f"{payload}; pending artifact presence is irrelevant. Explicit "\n                "account reconciliation is required before a new target can freeze"\n            )\n        if len(terminals) > 1:\n            raise PaperAccountStateRefused(\n                f"paper account has multiple terminal outcomes for {payload}"\n            )\n        if not terminals:\n            continue\n        terminal = terminals[0]\n        terminals_by_payload[payload] = terminal\n        if terminal.status == "execution_indeterminate":\n            reconciliation = journal.reconciliation(payload)\n            if not _valid_indeterminate_reconciliation(\n                terminal=terminal,\n                reconciliation=reconciliation,\n                prefix_index=prefix_index,\n                paper_account_identity_sha256=paper_account_identity_sha256,\n            ):\n                raise PaperAccountStateRefused(\n                    "paper account has an unreconciled execution_indeterminate outcome; "\n                    "explicit canonical/operational reconciliation is required before "\n                    "a new target can freeze"\n                )\n\n    for payload, terminal in terminals_by_payload.items():\n        _assert_terminal_bound_to_account(\n            terminal=terminal,\n            legacy_binding=journal.legacy_binding(payload),\n            prefix_index=prefix_index,\n            paper_account_identity_sha256=paper_account_identity_sha256,\n        )\n''',
          )

          replace_once(
              'src/quantagent/paper/daily_loop.py',
              '''            _freeze_daily_decision(\n                config,\n                as_of,\n                decision_kind="no_target",\n                paper_account_identity_sha256=account_identity.payload_sha256,\n                account_evidence=account_evidence,\n            )\n            predictions_path = write_frame(predictions, day_dir / "predictions.parquet")\n            weights_path = write_v7_target_weights(\n                weights,\n                day_dir / "target_weights.parquet",\n            )\n''',
              '''            # Stage every fallible daily artifact before the irreversible\n            # no-target marker. If a writer fails, the date remains rerunnable.\n            predictions_path = write_frame(predictions, day_dir / "predictions.parquet")\n            weights_path = write_v7_target_weights(\n                weights,\n                day_dir / "target_weights.parquet",\n            )\n            _freeze_daily_decision(\n                config,\n                as_of,\n                decision_kind="no_target",\n                paper_account_identity_sha256=account_identity.payload_sha256,\n                account_evidence=account_evidence,\n            )\n''',
          )

          replace_once(
              'src/quantagent/paper/daily_loop.py',
              '''        _freeze_daily_decision(\n            config,\n            as_of,\n            decision_kind="target",\n            paper_account_identity_sha256=account_identity.payload_sha256,\n            account_evidence=account_evidence,\n        )\n\n        predictions_path = write_frame(predictions, day_dir / "predictions.parquet")\n        weights_path = write_v7_target_weights(\n            weights,\n            day_dir / "target_weights.parquet",\n        )\n        predictions_file = Path(predictions_path)\n        target_weights_file = Path(weights_path)\n        pending, pending_path = PendingPaperSignalStore(config.pending_signal_dir).record(\n            signal_date=as_of,\n            target_weights=weights.target_weights,\n            source_lineage={\n                "model_dir": config.model_dir,\n                "feature_dataset_path": str(feature_path),\n                "market_panel_path": str(market_path),\n                "predictions_path": str(predictions_file),\n                "predictions_file_sha256": _file_sha256(predictions_file),\n                "target_weights_path": str(target_weights_file),\n                "target_weights_file_sha256": _file_sha256(target_weights_file),\n                "primary_horizon": str(config.primary_horizon),\n                "paper_account_identity_sha256": account_identity.payload_sha256,\n                "canonical_account_state_sha256": str(account_evidence["account_state_sha256"]),\n                "canonical_ledger_head_hash": str(account_evidence["canonical_head_hash"]),\n                "canonical_ledger_records": str(account_evidence["canonical_records"]),\n                "canonical_account_nav": str(account_evidence["nav"]),\n            },\n        )\n''',
              '''        # Persist and verify every fallible artifact, including pending-target\n        # date/weight validation, before committing the append-only daily freeze.\n        predictions_path = write_frame(predictions, day_dir / "predictions.parquet")\n        weights_path = write_v7_target_weights(\n            weights,\n            day_dir / "target_weights.parquet",\n        )\n        predictions_file = Path(predictions_path)\n        target_weights_file = Path(weights_path)\n        pending, pending_path = PendingPaperSignalStore(config.pending_signal_dir).record(\n            signal_date=as_of,\n            target_weights=weights.target_weights,\n            source_lineage={\n                "model_dir": config.model_dir,\n                "feature_dataset_path": str(feature_path),\n                "market_panel_path": str(market_path),\n                "predictions_path": str(predictions_file),\n                "predictions_file_sha256": _file_sha256(predictions_file),\n                "target_weights_path": str(target_weights_file),\n                "target_weights_file_sha256": _file_sha256(target_weights_file),\n                "primary_horizon": str(config.primary_horizon),\n                "paper_account_identity_sha256": account_identity.payload_sha256,\n                "canonical_account_state_sha256": str(account_evidence["account_state_sha256"]),\n                "canonical_ledger_head_hash": str(account_evidence["canonical_head_hash"]),\n                "canonical_ledger_records": str(account_evidence["canonical_records"]),\n                "canonical_account_nav": str(account_evidence["nav"]),\n            },\n        )\n        _freeze_daily_decision(\n            config,\n            as_of,\n            decision_kind="target",\n            paper_account_identity_sha256=account_identity.payload_sha256,\n            account_evidence=account_evidence,\n        )\n''',
          )

          replace_once(
              'src/quantagent/portfolio/position_age_tracker.py',
              '''                    and existing.expected_horizon_days is None\n''',
              '''                    and existing.expected_horizon_days\n                    in {None, UNKNOWN_INITIAL_HORIZON_DAYS}\n''',
          )

          replace_once(
              'src/quantagent/portfolio/v7_target_weights.py',
              '''        if previous_weights is not None and not previous_weights.empty:\n            initial_expected_horizons: dict[str, int | None] = {}\n''',
              '''        if previous_weights is not None:\n            # An explicitly supplied empty Series is authoritative cash-only state\n            # and must clear stale persisted ages before first-date lock checks.\n            initial_expected_horizons: dict[str, int | None] = {}\n''',
          )

          # Focused regressions: lock aliases.
          p = Path('tests/paper/test_continuous_execution_account_lock.py')
          text = p.read_text(encoding='utf-8')
          if 'test_account_lock_path_canonicalizes_symlink_alias' not in text:
              text = text.replace('import pandas as pd\n', 'import pandas as pd\nimport pytest\n\nimport quantagent.paper.account_lock as account_lock\n', 1)
              text += '''\n\ndef test_account_lock_path_canonicalizes_symlink_alias(tmp_path) -> None:\n    real_dir = tmp_path / "real"\n    real_dir.mkdir()\n    ledger = real_dir / "canonical.jsonl"\n    ledger.write_text("", encoding="utf-8")\n    alias_dir = tmp_path / "alias"\n    try:\n        alias_dir.symlink_to(real_dir, target_is_directory=True)\n    except OSError as exc:\n        pytest.skip(f"symlink creation unavailable: {exc}")\n\n    assert account_lock.paper_account_lock_path(ledger) == account_lock.paper_account_lock_path(\n        alias_dir / "canonical.jsonl"\n    )\n'''
              p.write_text(text, encoding='utf-8')

          # Focused regressions: journal isolation, uncertainty priority, parity.
          p = Path('tests/paper/test_daily_decision_and_legacy_binding.py')
          text = p.read_text(encoding='utf-8')
          if 'test_custom_canonical_ledger_derives_ledger_specific_journal' not in text:
              text = text.replace('from __future__ import annotations\n\n', 'from __future__ import annotations\n\nfrom pathlib import Path\nfrom types import SimpleNamespace\n\n', 1)
              text = text.replace('import pandas as pd\n', 'import pandas as pd\n\nimport quantagent.paper.continuous_execution as continuous_execution\nimport quantagent.paper.daily_loop as daily_loop\n', 1)
              text += '''\n\ndef test_custom_canonical_ledger_derives_ledger_specific_journal(tmp_path) -> None:\n    canonical = tmp_path / "paper" / "custom.jsonl"\n    config = DailyPaperLoopConfig(\n        as_of_date="2026-08-11",\n        canonical_ledger_path=str(canonical),\n        execution_journal_path=None,\n    )\n    resolved = Path(daily_loop._execution_journal_path(config))\n    assert resolved == canonical.with_name("custom.execution_journal.jsonl")\n    assert resolved != canonical.with_name("execution_journal.jsonl")\n\n\ndef test_indeterminate_account_prepass_outranks_legacy_binding_order(tmp_path) -> None:\n    daily = _daily_config(tmp_path, "2026-08-12")\n    journal = PendingExecutionJournal(daily.execution_journal_path)\n    journal.append(\n        pending_payload_sha256="a" * 64,\n        signal_date="2026-08-08",\n        execution_date="2026-08-09",\n        status="execution_observed",\n        details={"target_weights_sha256": "c" * 64},\n    )\n    journal.append(\n        pending_payload_sha256="b" * 64,\n        signal_date="2026-08-10",\n        execution_date="2026-08-11",\n        status="execution_indeterminate",\n        details={"target_weights_sha256": "d" * 64},\n    )\n    identity_sha = "f" * 64\n\n    with pytest.raises(PaperAccountStateRefused, match="unreconciled execution_indeterminate"):\n        daily_loop._assert_execution_journal_resolved(\n            journal,\n            prefix_index=build_canonical_prefix_index(daily.canonical_ledger_path),\n            paper_account_identity_sha256=identity_sha,\n        )\n    with pytest.raises(\n        continuous_execution.ContinuousPaperExecutionBlocked,\n        match="unreconciled execution_indeterminate",\n    ):\n        continuous_execution._assert_account_execution_state_resolved(\n            journal,\n            canonical_ledger_path=daily.canonical_ledger_path,\n            paper_account_identity_sha256=identity_sha,\n        )\n\n\ndef test_recovered_consistency_refuses_empty_operational_history_with_canonical_economics() -> None:\n    held = SimpleNamespace(total=100.0, is_flat=False)\n    canonical = SimpleNamespace(\n        portfolio=SimpleNamespace(\n            positions={"600000.SH": held},\n            cash=99_000.0,\n            initial_cash=100_000.0,\n        ),\n        orders={},\n        fills=[],\n    )\n    operational = SimpleNamespace(\n        portfolio=SimpleNamespace(positions={}, cash=100_000.0, initial_cash=100_000.0),\n        orders={},\n        fills=[],\n    )\n    with pytest.raises(\n        continuous_execution.ContinuousPaperExecutionBlocked,\n        match="operational paper ledger has no reconstructable economics",\n    ):\n        continuous_execution._assert_recovered_account_consistent(canonical, operational)\n'''
              p.write_text(text, encoding='utf-8')

          # Focused regressions: permanent freeze must be last fallible decision step.
          p = Path('tests/paper/test_daily_loop_pending_execution.py')
          text = p.read_text(encoding='utf-8')
          if 'test_target_date_validation_failure_does_not_permanently_freeze_day' not in text:
              text += '''\n\ndef test_target_date_validation_failure_does_not_permanently_freeze_day(tmp_path, monkeypatch) -> None:\n    targets = pd.DataFrame(\n        {\n            "trade_date": [pd.Timestamp("2026-08-06")],\n            "600000.SH": [0.5],\n        }\n    )\n    as_of, config, _ = _install_common_mocks(tmp_path, monkeypatch, targets=targets)\n    with pytest.raises(ValueError, match="requires exactly the current signal date"):\n        daily_loop.run_once(config)\n    journal = daily_loop.PendingExecutionJournal(daily_loop._execution_journal_path(config))\n    assert journal.daily_decision(as_of) is None\n\n\ndef test_artifact_write_failure_does_not_permanently_freeze_day(tmp_path, monkeypatch) -> None:\n    targets = pd.DataFrame(\n        {\n            "trade_date": [pd.Timestamp("2026-08-07")],\n            "600000.SH": [0.5],\n        }\n    )\n    as_of, config, _ = _install_common_mocks(tmp_path, monkeypatch, targets=targets)\n\n    def fail_write(*_args, **_kwargs):\n        raise OSError("simulated artifact write failure")\n\n    monkeypatch.setattr(daily_loop, "write_frame", fail_write)\n    with pytest.raises(OSError, match="simulated artifact write failure"):\n        daily_loop.run_once(config)\n    journal = daily_loop.PendingExecutionJournal(daily_loop._execution_journal_path(config))\n    assert journal.daily_decision(as_of) is None\n'''
              p.write_text(text, encoding='utf-8')

          # Focused regressions: restart sentinel and explicit cash-only state.
          p = Path('tests/portfolio/test_position_age_tracker_account_reconciliation.py')
          text = p.read_text(encoding='utf-8')
          if 'test_real_horizon_replaces_unknown_restart_sentinel_before_lock' not in text:
              text = text.replace(
                  'from quantagent.portfolio.position_age_tracker import PositionAgeTracker\n',
                  'from quantagent.portfolio.position_age_tracker import (\n    UNKNOWN_INITIAL_HORIZON_DAYS,\n    PositionAgeTracker,\n)\n',
                  1,
              )
              text += '''\n\ndef test_real_horizon_replaces_unknown_restart_sentinel_before_lock(tmp_path) -> None:\n    state_path = tmp_path / "position_age.parquet"\n    tracker = PositionAgeTracker(state_path=state_path)\n    tracker.begin_session({"HELD": 0.25})\n    first = tracker.snapshot().set_index("symbol")\n    assert int(first.loc["HELD", "expected_horizon_days"]) == UNKNOWN_INITIAL_HORIZON_DAYS\n    tracker.persist()\n\n    restarted = PositionAgeTracker.from_state(state_path)\n    restarted.begin_session({"HELD": 0.25}, {"HELD": 5})\n    updated = restarted.snapshot().set_index("symbol")\n    assert int(updated.loc["HELD", "expected_horizon_days"]) == 5\n'''
              p.write_text(text, encoding='utf-8')

          p = Path('tests/test_v7_target_initial_weights.py')
          text = p.read_text(encoding='utf-8')
          if 'test_explicit_empty_initial_weights_still_reconcile_age_tracker' not in text:
              text = text.replace('import pandas as pd\n', 'import pandas as pd\n\nimport quantagent.portfolio.v7_target_weights as v7_target_weights\n', 1)
              text += '''\n\ndef test_explicit_empty_initial_weights_still_reconcile_age_tracker(monkeypatch) -> None:\n    predictions, market, _ = _two_session_inputs()\n    calls: list[dict[str, float]] = []\n    original = v7_target_weights.PositionAgeTracker.begin_session\n\n    def spy(self, initial_weights, expected_horizons=None):\n        calls.append(dict(initial_weights or {}))\n        return original(self, initial_weights, expected_horizons)\n\n    monkeypatch.setattr(v7_target_weights.PositionAgeTracker, "begin_session", spy)\n    build_v7_target_weights(\n        predictions,\n        market,\n        config=_config(\n            timing_gate_enabled=False,\n            holding_period_mode="hard",\n            max_turnover=1.0,\n        ),\n        initial_weights=pd.Series(dtype=float),\n    )\n    assert calls == [{}]\n'''
              p.write_text(text, encoding='utf-8')
          PY
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -e ".[test]"
      - name: Compile and run focused regressions
        run: |
          python -m compileall -q src
          python -m pytest \
            tests/paper/test_continuous_execution_account_lock.py \
            tests/paper/test_daily_decision_and_legacy_binding.py \
            tests/paper/test_daily_loop_pending_execution.py \
            tests/portfolio/test_position_age_tracker_account_reconciliation.py \
            tests/test_v7_target_initial_weights.py \
            tests/paper/test_daily_loop_prior_execution_gate.py \
            -q
          git diff --check
      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/quantagent/paper/account_lock.py \
            src/quantagent/paper/continuous_execution.py \
            src/quantagent/paper/daily_loop.py \
            src/quantagent/portfolio/position_age_tracker.py \
            src/quantagent/portfolio/v7_target_weights.py \
            tests/paper/test_continuous_execution_account_lock.py \
            tests/paper/test_daily_decision_and_legacy_binding.py \
            tests/paper/test_daily_loop_pending_execution.py \
            tests/portfolio/test_position_age_tracker_account_reconciliation.py \
            tests/test_v7_target_initial_weights.py
          git diff --cached --quiet && exit 0
