name: Factor Research Cycle

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated canonical A-share symbols, e.g. 600519.SH,000001.SZ"
        required: true
        type: string
      start_date:
        description: "Research history start date"
        required: false
        default: "2020-01-01"
        type: string
      target_horizon:
        description: "Executable target horizon in sessions"
        required: false
        default: "5"
        type: string
  schedule:
    # Weekly research refresh. Scheduled runs require repository variable
    # FACTOR_RESEARCH_SYMBOLS; without an explicit universe the job skips rather
    # than reconstructing history from today's constituents.
    - cron: "20 0 * * 1"

permissions:
  contents: read

jobs:
  research-only-factor-cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FACTOR_SYMBOLS: ${{ github.event.inputs.symbols || vars.FACTOR_RESEARCH_SYMBOLS }}
      FACTOR_START_DATE: ${{ github.event.inputs.start_date || vars.FACTOR_RESEARCH_START_DATE || '2020-01-01' }}
      FACTOR_TARGET_HORIZON: ${{ github.event.inputs.target_horizon || '5' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate explicit research universe
        id: universe
        shell: bash
        run: |
          if [ -z "${FACTOR_SYMBOLS// }" ]; then
            echo "No explicit factor-research universe configured; skipping to avoid survivorship-biased universe invention."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install research data runtime
        if: steps.universe.outputs.enabled == 'true'
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -e . "baostock>=0.9.3"

      - name: Pull raw BaoStock data and evaluate factors
        if: steps.universe.outputs.enabled == 'true'
        run: |
          python scripts/run_factor_research_cycle.py \
            --provider baostock \
            --symbols "$FACTOR_SYMBOLS" \
            --start-date "$FACTOR_START_DATE" \
            --end-date "$(date -u +%F)" \
            --target-horizon "$FACTOR_TARGET_HORIZON" \
            --output-dir runtime/research/factor_cycle

      - name: Assert research-only truth boundary
        if: steps.universe.outputs.enabled == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('runtime/research/factor_cycle/manifest.json').read_text())
          assert payload['research_only'] is True
          assert payload['economic_live_eligible'] is False
          assert payload['automatic_factor_activation'] is False
          assert payload['source']['production_integrity_certified'] is False
          PY

      - name: Upload factor research evidence
        if: steps.universe.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: factor-research-${{ github.run_id }}
          path: runtime/research/factor_cycle/
          if-no-files-found: error
          retention-days: 30
