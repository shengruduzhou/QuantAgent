name: PR141 Review Remediation V4

on:
  push:
    branches:
      - agent/account-aware-target-construction
    paths:
      - .github/workflows/pr141-remediation-v4.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v6
        with:
          ref: agent/account-aware-target-construction
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply exact-head remediation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/quantagent/paper/continuous_execution.py')
          text = p.read_text(encoding='utf-8')
          if not text.endswith('\n'):
              p.write_text(text + '\n', encoding='utf-8')
          PY
          python scripts/pr141_remediate.py
      - name: Install and test
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -e ".[test,optimization]"
          python -m compileall -q src/quantagent/paper src/quantagent/portfolio src/quantagent/cli
          python -m pytest \
            tests/paper/test_daily_decision_and_legacy_binding.py \
            tests/paper/test_daily_loop_account_aware_construction.py \
            tests/paper/test_daily_loop_prior_execution_gate.py \
            tests/paper/test_continuous_execution_account_lock.py \
            tests/portfolio/test_position_age_tracker_account_reconciliation.py \
            tests/test_v7_target_initial_weights.py \
            tests/test_v7_target_cvxpy_dropped_holding.py \
            -q
      - name: Commit validated business changes only
        shell: bash
        run: |
          # Workflow mutation is applied later through the GitHub connector, because
          # Actions GITHUB_TOKEN cannot push workflow-file changes without workflows permission.
          git restore -- .github/workflows/ci.yml
          git config user.name "quantagent-review-remediator"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/quantagent/paper/execution_journal.py \
            src/quantagent/paper/legacy_terminal_binding.py \
            src/quantagent/paper/daily_loop.py \
            src/quantagent/paper/continuous_execution.py \
            src/quantagent/cli/paper.py \
            src/quantagent/portfolio/v7_target_weights.py \
            tests/paper/test_daily_decision_and_legacy_binding.py \
            tests/test_v7_target_cvxpy_dropped_holding.py
          git diff --cached --check
          git diff --cached --stat
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(paper): close durable evidence review gaps"
          git push origin HEAD:agent/account-aware-target-construction
