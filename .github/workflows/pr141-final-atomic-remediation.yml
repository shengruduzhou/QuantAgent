name: PR141 Final Atomic Evidence Remediation

on:
  push:
    branches:
      - agent/account-aware-target-construction

permissions:
  contents: write

jobs:
  remediate:
    if: "github.event.head_commit.message == 'chore(ci): execute final PR141 atomic evidence remediation'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: agent/account-aware-target-construction
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply deterministic reviewed patch
        run: python scripts/pr141_final_atomic_patch_v2.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -e ".[test]"
      - name: Compile and focused adversarial regressions
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q src
          python -m pytest \
            tests/paper/test_continuous_pending_execution.py \
            tests/paper/test_canonical_prefix_receipt.py \
            tests/paper/test_daily_loop_pending_execution.py \
            tests/paper/test_daily_loop_prior_execution_gate.py \
            tests/paper/test_daily_loop_account_aware_construction.py \
            tests/paper/test_daily_decision_and_legacy_binding.py \
            tests/paper/test_continuous_execution_account_lock.py \
            tests/portfolio/test_position_age_tracker_account_reconciliation.py \
            tests/test_v7_target_initial_weights.py \
            tests/test_v7_phase3_dynamic_portfolio.py \
            tests/test_v7_target_cvxpy_dropped_holding.py \
            -q --junitxml=focused-results.xml 2>&1 | tee focused.log
          git diff --check
      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr141-final-atomic-focused-v2
          path: |
            focused.log
            focused-results.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Commit validated business and regression changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/quantagent/paper/daily_loop.py \
            src/quantagent/paper/continuous_execution.py \
            src/quantagent/portfolio/position_age_tracker.py \
            src/quantagent/portfolio/v7_target_weights.py \
            tests/paper/test_continuous_pending_execution.py \
            tests/paper/test_canonical_prefix_receipt.py \
            tests/paper/test_daily_loop_pending_execution.py \
            tests/paper/test_daily_loop_prior_execution_gate.py \
            tests/paper/test_daily_loop_account_aware_construction.py \
            tests/portfolio/test_position_age_tracker_account_reconciliation.py \
            tests/paper/test_daily_decision_and_legacy_binding.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(paper): atomically bind daily audit evidence"
          git push origin HEAD:agent/account-aware-target-construction
