name: PR141 Review Remediation

on:
  push:
    branches:
      - agent/account-aware-target-construction
    paths:
      - .github/workflows/pr141-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: agent/account-aware-target-construction
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply narrowly scoped review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_n(path: str, old: str, replacements: list[str]) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != len(replacements):
                  raise SystemExit(
                      f"{path}: expected {len(replacements)} replacement targets, found {text.count(old)}"
                  )
              for new in replacements:
                  text = text.replace(old, new, 1)
              p.write_text(text, encoding="utf-8")

          def write_new(path: str, content: str) -> None:
              p = Path(path)
              if p.exists():
                  raise SystemExit(f"refusing to overwrite unexpected existing file: {path}")
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding="utf-8")

          journal = "src/quantagent/paper/execution_journal.py"
          replace_once(
              journal,
              '''RECONCILIATION_STATUS = "execution_reconciled"\nLEGACY_BINDING_STATUS = "legacy_terminal_bound"\n_ALLOWED_STATUSES = TERMINAL_OUTCOMES | {\n    "execution_started",\n    RECONCILIATION_STATUS,\n    LEGACY_BINDING_STATUS,\n}\n''',
              '''RECONCILIATION_STATUS = "execution_reconciled"\nLEGACY_BINDING_STATUS = "legacy_terminal_bound"\nDAILY_DECISION_STATUS = "daily_decision_frozen"\n_ALLOWED_STATUSES = TERMINAL_OUTCOMES | {\n    "execution_started",\n    RECONCILIATION_STATUS,\n    LEGACY_BINDING_STATUS,\n    DAILY_DECISION_STATUS,\n}\n''',
          )
          replace_once(
              journal,
              '''    def legacy_binding(self, pending_payload_sha256: str) -> PendingExecutionRecord | None:\n        history = self.history(pending_payload_sha256)\n        rows = [record for record in history if record.status == LEGACY_BINDING_STATUS]\n        if len(rows) > 1:\n            raise ExecutionJournalCorruption(\n                f"pending signal {pending_payload_sha256} has multiple legacy binding records"\n            )\n        return rows[0] if rows else None\n\n    def has_unresolved_start(self, pending_payload_sha256: str) -> bool:\n''',
              '''    def legacy_binding(self, pending_payload_sha256: str) -> PendingExecutionRecord | None:\n        history = self.history(pending_payload_sha256)\n        rows = [record for record in history if record.status == LEGACY_BINDING_STATUS]\n        if len(rows) > 1:\n            raise ExecutionJournalCorruption(\n                f"pending signal {pending_payload_sha256} has multiple legacy binding records"\n            )\n        return rows[0] if rows else None\n\n    def daily_decision(self, signal_date: str) -> PendingExecutionRecord | None:\n        rows = [\n            record\n            for record in self.records()\n            if record.status == DAILY_DECISION_STATUS\n            and record.signal_date == str(signal_date)\n        ]\n        if len(rows) > 1:\n            raise ExecutionJournalCorruption(\n                f"signal date {signal_date} has multiple daily decision freeze records"\n            )\n        return rows[0] if rows else None\n\n    def has_unresolved_start(self, pending_payload_sha256: str) -> bool:\n''',
          )
          replace_once(
              journal,
              '''            legacy_binding = legacy_bindings[0] if legacy_bindings else None\n\n            if status == RECONCILIATION_STATUS:\n''',
              '''            legacy_binding = legacy_bindings[0] if legacy_bindings else None\n            same_date_decisions = [\n                record\n                for record in records\n                if record.status == DAILY_DECISION_STATUS\n                and record.signal_date == str(signal_date)\n            ]\n            if len(same_date_decisions) > 1:\n                raise ExecutionJournalCorruption(\n                    f"signal date {signal_date} has multiple daily decision freeze records"\n                )\n\n            if status == RECONCILIATION_STATUS:\n''',
          )
          replace_once(
              journal,
              '''                if legacy_binding is not None:\n                    if legacy_binding.details == normalized_details:\n                        return legacy_binding\n                    raise ExecutionJournalCorruption(\n                        f"pending signal {pending_payload_sha256} is already legacy-bound"\n                    )\n            elif terminal is not None:\n''',
              '''                account_state_sha = str(normalized_details.get("account_state_sha256") or "")\n                target_sha = str(normalized_details.get("target_weights_sha256") or "")\n                if len(account_state_sha) != 64 or len(target_sha) != 64:\n                    raise ExecutionJournalCorruption(\n                        "legacy_terminal_bound requires reconciled account-state and target digests"\n                    )\n                if legacy_binding is not None:\n                    if legacy_binding.details == normalized_details:\n                        return legacy_binding\n                    raise ExecutionJournalCorruption(\n                        f"pending signal {pending_payload_sha256} is already legacy-bound"\n                    )\n            elif status == DAILY_DECISION_STATUS:\n                decision_kind = str(normalized_details.get("decision_kind") or "")\n                if decision_kind not in {"target", "no_target"}:\n                    raise ExecutionJournalCorruption(\n                        "daily_decision_frozen requires decision_kind target|no_target"\n                    )\n                identity_sha = str(normalized_details.get("paper_account_identity_sha256") or "")\n                state_sha = str(normalized_details.get("canonical_account_state_sha256") or "")\n                canonical_head = str(normalized_details.get("canonical_head") or "")\n                try:\n                    canonical_records = int(normalized_details["canonical_records"])\n                except (KeyError, TypeError, ValueError) as exc:\n                    raise ExecutionJournalCorruption(\n                        "daily_decision_frozen requires canonical_records"\n                    ) from exc\n                if (\n                    len(identity_sha) != 64\n                    or len(state_sha) != 64\n                    or len(canonical_head) != 64\n                    or canonical_records < 0\n                    or str(normalized_details.get("assurance") or "")\n                    != "canonical_account_daily_decision_freeze_v1"\n                ):\n                    raise ExecutionJournalCorruption(\n                        "daily_decision_frozen canonical/account binding is invalid"\n                    )\n                if same_date_decisions:\n                    existing_decision = same_date_decisions[0]\n                    if (\n                        existing_decision.pending_payload_sha256\n                        == str(pending_payload_sha256)\n                        and existing_decision.details == normalized_details\n                    ):\n                        return existing_decision\n                    raise ExecutionJournalCorruption(\n                        f"signal date {signal_date} is already durably frozen"\n                    )\n            elif terminal is not None:\n''',
          )
          replace_once(
              journal,
              '''    "RECONCILIATION_STATUS",\n    "LEGACY_BINDING_STATUS",\n''',
              '''    "RECONCILIATION_STATUS",\n    "LEGACY_BINDING_STATUS",\n    "DAILY_DECISION_STATUS",\n''',
          )

          write_new(
              "src/quantagent/paper/legacy_terminal_binding.py",
              '''"""Append-only validation for operator-reconciled legacy paper terminals.\n\nLegacy terminals predate execution-time canonical-prefix receipts. They may be\nmade usable only by a distinct append-only operator attestation. The attestation\nnever upgrades historical assurance: it binds the immutable terminal hash, target\ndigest, immutable account identity and a later reconciled canonical/account\nsnapshot, and remains distinguishable from an original execution-time receipt.\n"""\n\nfrom __future__ import annotations\n\nfrom quantagent.paper.canonical_receipt import (\n    CanonicalPrefixIndex,\n    CanonicalPrefixReceiptError,\n)\nfrom quantagent.paper.execution_journal import LEGACY_BINDING_STATUS\n\n\nclass LegacyTerminalBindingError(RuntimeError):\n    """A legacy-terminal operator binding is absent or cannot be verified."""\n\n\ndef verify_legacy_terminal_binding(\n    terminal,\n    binding,\n    *,\n    prefix_index: CanonicalPrefixIndex,\n    expected_paper_account_identity_sha256: str,\n    expected_target_weights_sha256: str | None = None,\n) -> None:\n    if binding is None:\n        raise LegacyTerminalBindingError(\n            "legacy terminal has no append-only operator reconciliation binding"\n        )\n    if str(getattr(binding, "status", "")) != LEGACY_BINDING_STATUS:\n        raise LegacyTerminalBindingError("unexpected legacy terminal binding status")\n    details = dict(getattr(binding, "details", {}) or {})\n    if str(details.get("terminal_record_sha256") or "") != str(terminal.record_sha256):\n        raise LegacyTerminalBindingError(\n            "legacy terminal binding does not match the immutable terminal record"\n        )\n    if str(details.get("paper_account_identity_sha256") or "") != str(\n        expected_paper_account_identity_sha256\n    ):\n        raise LegacyTerminalBindingError(\n            "legacy terminal binding paper-account identity mismatch"\n        )\n    if str(details.get("assurance") or "") != "operator_reconciled_legacy_terminal_v1":\n        raise LegacyTerminalBindingError("legacy terminal binding assurance is invalid")\n    account_state_sha = str(details.get("account_state_sha256") or "")\n    if len(account_state_sha) != 64:\n        raise LegacyTerminalBindingError(\n            "legacy terminal binding lacks a reconciled account-state digest"\n        )\n    binding_target = str(details.get("target_weights_sha256") or "")\n    terminal_target = str(dict(terminal.details or {}).get("target_weights_sha256") or "")\n    if not binding_target or len(binding_target) != 64:\n        raise LegacyTerminalBindingError("legacy terminal binding lacks target digest")\n    if terminal_target and terminal_target != binding_target:\n        raise LegacyTerminalBindingError(\n            "legacy terminal binding target digest conflicts with terminal evidence"\n        )\n    if (\n        expected_target_weights_sha256 is not None\n        and binding_target != str(expected_target_weights_sha256)\n    ):\n        raise LegacyTerminalBindingError(\n            "legacy terminal binding target digest mismatch"\n        )\n    try:\n        canonical_records = int(details["canonical_records"])\n        canonical_head = str(details["canonical_head"])\n        if prefix_index.head_at(canonical_records) != canonical_head:\n            raise LegacyTerminalBindingError(\n                "legacy terminal binding canonical prefix no longer matches"\n            )\n    except LegacyTerminalBindingError:\n        raise\n    except (CanonicalPrefixReceiptError, KeyError, TypeError, ValueError) as exc:\n        raise LegacyTerminalBindingError(\n            "legacy terminal binding canonical prefix is invalid"\n        ) from exc\n\n\n__all__ = ["LegacyTerminalBindingError", "verify_legacy_terminal_binding"]\n''',
          )

          daily = "src/quantagent/paper/daily_loop.py"
          replace_once(
              daily,
              'from quantagent.paper.execution_journal import TERMINAL_OUTCOMES, PendingExecutionJournal\n',
              '''from quantagent.paper.execution_journal import (\n    DAILY_DECISION_STATUS,\n    TERMINAL_OUTCOMES,\n    PendingExecutionJournal,\n)\nfrom quantagent.paper.legacy_terminal_binding import (\n    LegacyTerminalBindingError,\n    verify_legacy_terminal_binding,\n)\n''',
          )
          state_write = '''            account_state = fresh_account_state\n            account_evidence = account_state.evidence()\n            predictions_path = write_frame(predictions, day_dir / "predictions.parquet")\n'''
          replace_n(
              daily,
              state_write,
              [
                  '''            account_state = fresh_account_state\n            account_evidence = account_state.evidence()\n            _freeze_daily_decision(\n                config,\n                as_of,\n                decision_kind="no_target",\n                paper_account_identity_sha256=account_identity.payload_sha256,\n                account_evidence=account_evidence,\n            )\n            predictions_path = write_frame(predictions, day_dir / "predictions.parquet")\n''',
                  '''            account_state = fresh_account_state\n            account_evidence = account_state.evidence()\n            _freeze_daily_decision(\n                config,\n                as_of,\n                decision_kind="target",\n                paper_account_identity_sha256=account_identity.payload_sha256,\n                account_evidence=account_evidence,\n            )\n            predictions_path = write_frame(predictions, day_dir / "predictions.parquet")\n''',
              ],
          )
          replace_once(
              daily,
              '''def _assert_current_signal_not_frozen(\n    config: DailyPaperLoopConfig,\n    as_of: str,\n) -> None:\n    """Prevent a second same-date writer from mutating hash-bound evidence files.\n\n    The account lock must already be held. A frozen pending signal is immutable\n    economic evidence; its referenced prediction/target files must therefore be\n    immutable too. Re-running inference for the same signal date is allowed only\n    after an explicit operator workflow has dealt with the existing frozen\n    intent, rather than silently replacing its lineage artifacts.\n    """\n\n    existing = PendingPaperSignalStore(config.pending_signal_dir).read(as_of)\n    if existing is not None:\n        raise PaperAccountStateRefused(\n            "pending paper signal is already frozen for the current signal date; "\n            "refusing to overwrite its hash-bound predictions/target artifacts"\n        )\n\n\n''',
              '''def _assert_current_signal_not_frozen(\n    config: DailyPaperLoopConfig,\n    as_of: str,\n) -> None:\n    """Fail closed if any durable evidence already owns this signal date.\n\n    Pending JSON is only one lifecycle artifact and may be deleted after a\n    terminal outcome. The append-only execution journal therefore carries an\n    independent daily-decision freeze marker, including no-target decisions.\n    Legacy pre-marker terminal/start history and an existing summary also block\n    reuse of the date so upgrades cannot overwrite historical audit evidence.\n    The account lock must already be held by the caller.\n    """\n\n    existing = PendingPaperSignalStore(config.pending_signal_dir).read(as_of)\n    if existing is not None:\n        raise PaperAccountStateRefused(\n            "pending paper signal is already frozen for the current signal date; "\n            "refusing to overwrite its hash-bound predictions/target artifacts"\n        )\n    summary_path = Path(config.output_root) / as_of / "daily_loop_summary.json"\n    if summary_path.exists():\n        raise PaperAccountStateRefused(\n            "daily paper decision evidence already exists for the current signal date; "\n            "refusing to overwrite its summary/prediction/target lineage"\n        )\n    journal = PendingExecutionJournal(config.execution_journal_path)\n    if not journal.verify():\n        raise PaperAccountStateRefused(\n            "pending execution journal verification failed before same-date freeze check"\n        )\n    marker = journal.daily_decision(as_of)\n    if marker is not None:\n        raise PaperAccountStateRefused(\n            "daily paper decision is already durably frozen for the current signal date"\n        )\n    same_date_economic = [\n        record\n        for record in journal.records()\n        if record.signal_date == as_of\n        and (record.status == "execution_started" or record.status in TERMINAL_OUTCOMES)\n    ]\n    if same_date_economic:\n        raise PaperAccountStateRefused(\n            "legacy same-date execution evidence already exists; refusing to reuse "\n            "the signal date without rewriting append-only history"\n        )\n\n\ndef _freeze_daily_decision(\n    config: DailyPaperLoopConfig,\n    as_of: str,\n    *,\n    decision_kind: str,\n    paper_account_identity_sha256: str,\n    account_evidence: dict[str, object],\n) -> None:\n    """Append the irreversible same-date decision marker before artifact writes.\n\n    A crash after this record sacrifices liveness and requires operator review,\n    but it cannot leave a previously auditable date silently reusable. This is\n    intentional fail-closed paper/shadow behavior.\n    """\n\n    material = (\n        "quantagent.paper.daily_decision.v1|"\n        f"{as_of}|{paper_account_identity_sha256}"\n    ).encode("utf-8")\n    payload_sha = sha256(material).hexdigest()\n    journal = PendingExecutionJournal(config.execution_journal_path)\n    if not journal.verify():\n        raise PaperAccountStateRefused(\n            "pending execution journal verification failed before daily decision freeze"\n        )\n    journal.append(\n        pending_payload_sha256=payload_sha,\n        signal_date=as_of,\n        execution_date=as_of,\n        status=DAILY_DECISION_STATUS,\n        details={\n            "decision_kind": str(decision_kind),\n            "paper_account_identity_sha256": str(paper_account_identity_sha256),\n            "canonical_account_state_sha256": str(\n                account_evidence["account_state_sha256"]\n            ),\n            "canonical_records": int(account_evidence["canonical_records"]),\n            "canonical_head": str(account_evidence["canonical_head_hash"]),\n            "assurance": "canonical_account_daily_decision_freeze_v1",\n        },\n    )\n\n\n''',
          )
          replace_once(
              daily,
              '''def _assert_terminal_bound_to_account(\n    *,\n    terminal,\n    prefix_index,\n    paper_account_identity_sha256: str,\n    expected_target_weights_sha256: str | None = None,\n    signal_date: str | None = None,\n) -> None:\n    receipt = dict(terminal.details or {}).get("canonical_prefix_receipt")\n    try:\n        verification = verify_canonical_prefix_receipt(\n            receipt,\n            prefix_index=prefix_index,\n            expected_target_weights_sha256=expected_target_weights_sha256,\n            expected_paper_account_identity_sha256=(\n                paper_account_identity_sha256 if receipt is not None else None\n            ),\n        )\n    except CanonicalPrefixReceiptError as exc:\n        location = f"signal_date={signal_date}: " if signal_date else ""\n        raise PaperAccountStateRefused(\n            "paper execution terminal no longer matches the canonical account: "\n            f"{location}{exc}"\n        ) from exc\n    if not verification.bound:\n        location = f"signal_date={signal_date}; " if signal_date else ""\n        raise PaperAccountStateRefused(\n            "paper execution terminal lacks a canonical-prefix/account-identity "\n            f"receipt: {location}explicitly reconcile legacy evidence before "\n            "freezing a new target"\n        )\n\n\n''',
              '''def _assert_terminal_bound_to_account(\n    *,\n    terminal,\n    legacy_binding,\n    prefix_index,\n    paper_account_identity_sha256: str,\n    expected_target_weights_sha256: str | None = None,\n    signal_date: str | None = None,\n) -> None:\n    receipt = dict(terminal.details or {}).get("canonical_prefix_receipt")\n    try:\n        verification = verify_canonical_prefix_receipt(\n            receipt,\n            prefix_index=prefix_index,\n            expected_target_weights_sha256=expected_target_weights_sha256,\n            expected_paper_account_identity_sha256=(\n                paper_account_identity_sha256 if receipt is not None else None\n            ),\n        )\n    except CanonicalPrefixReceiptError as exc:\n        location = f"signal_date={signal_date}: " if signal_date else ""\n        raise PaperAccountStateRefused(\n            "paper execution terminal no longer matches the canonical account: "\n            f"{location}{exc}"\n        ) from exc\n    if verification.bound:\n        return\n    try:\n        verify_legacy_terminal_binding(\n            terminal,\n            legacy_binding,\n            prefix_index=prefix_index,\n            expected_paper_account_identity_sha256=paper_account_identity_sha256,\n            expected_target_weights_sha256=expected_target_weights_sha256,\n        )\n    except LegacyTerminalBindingError as exc:\n        location = f"signal_date={signal_date}; " if signal_date else ""\n        raise PaperAccountStateRefused(\n            "paper execution terminal lacks valid execution-time receipt or "\n            f"operator-reconciled legacy binding: {location}{exc}"\n        ) from exc\n\n\n''',
          )
          replace_once(
              daily,
              '''        _assert_terminal_bound_to_account(\n            terminal=terminal,\n            prefix_index=prefix_index,\n            paper_account_identity_sha256=paper_account_identity_sha256,\n        )\n''',
              '''        _assert_terminal_bound_to_account(\n            terminal=terminal,\n            legacy_binding=journal.legacy_binding(payload),\n            prefix_index=prefix_index,\n            paper_account_identity_sha256=paper_account_identity_sha256,\n        )\n''',
          )
          replace_once(
              daily,
              '''        _assert_terminal_bound_to_account(\n            terminal=terminal,\n            prefix_index=prefix_index,\n            paper_account_identity_sha256=paper_account_identity_sha256,\n            expected_target_weights_sha256=signal.target_weights_sha256,\n            signal_date=signal.signal_date,\n        )\n''',
              '''        _assert_terminal_bound_to_account(\n            terminal=terminal,\n            legacy_binding=journal.legacy_binding(signal.payload_sha256),\n            prefix_index=prefix_index,\n            paper_account_identity_sha256=paper_account_identity_sha256,\n            expected_target_weights_sha256=signal.target_weights_sha256,\n            signal_date=signal.signal_date,\n        )\n''',
          )

          execution = "src/quantagent/paper/continuous_execution.py"
          replace_once(
              execution,
              '''from quantagent.paper.execution_journal import (\n    RECONCILIATION_STATUS,\n    TERMINAL_OUTCOMES,\n    PendingExecutionJournal,\n)\n''',
              '''from quantagent.paper.execution_journal import (\n    LEGACY_BINDING_STATUS,\n    RECONCILIATION_STATUS,\n    TERMINAL_OUTCOMES,\n    PendingExecutionJournal,\n)\nfrom quantagent.paper.legacy_terminal_binding import (\n    LegacyTerminalBindingError,\n    verify_legacy_terminal_binding,\n)\n''',
          )
          replace_once(
              execution,
              '''def _verify_terminal_canonical_binding(\n    *,\n    terminal,\n    canonical_ledger_path: str,\n    expected_target_weights_sha256: str | None = None,\n    expected_paper_account_identity_sha256: str | None = None,\n):\n    receipt = dict(terminal.details or {}).get("canonical_prefix_receipt")\n    try:\n        return verify_canonical_prefix_receipt(\n            receipt,\n            ledger_or_path=canonical_ledger_path,\n            expected_target_weights_sha256=expected_target_weights_sha256,\n            expected_paper_account_identity_sha256=expected_paper_account_identity_sha256,\n        )\n    except CanonicalPrefixReceiptError as exc:\n        raise ContinuousPaperExecutionBlocked(\n            "terminal paper execution evidence no longer matches the canonical "\n            f"economic ledger: {exc}"\n        ) from exc\n\n\n''',
              '''def _verify_terminal_canonical_binding(\n    *,\n    terminal,\n    legacy_binding,\n    canonical_ledger_path: str,\n    expected_target_weights_sha256: str | None = None,\n    expected_paper_account_identity_sha256: str | None = None,\n):\n    receipt = dict(terminal.details or {}).get("canonical_prefix_receipt")\n    try:\n        verification = verify_canonical_prefix_receipt(\n            receipt,\n            ledger_or_path=canonical_ledger_path,\n            expected_target_weights_sha256=expected_target_weights_sha256,\n            expected_paper_account_identity_sha256=expected_paper_account_identity_sha256,\n        )\n    except CanonicalPrefixReceiptError as exc:\n        raise ContinuousPaperExecutionBlocked(\n            "terminal paper execution evidence no longer matches the canonical "\n            f"economic ledger: {exc}"\n        ) from exc\n    if verification.bound:\n        return verification\n    if expected_paper_account_identity_sha256 is None:\n        raise ContinuousPaperExecutionBlocked(\n            "legacy terminal verification requires the immutable paper-account identity"\n        )\n    try:\n        verify_legacy_terminal_binding(\n            terminal,\n            legacy_binding,\n            prefix_index=build_canonical_prefix_index(canonical_ledger_path),\n            expected_paper_account_identity_sha256=expected_paper_account_identity_sha256,\n            expected_target_weights_sha256=expected_target_weights_sha256,\n        )\n    except LegacyTerminalBindingError as exc:\n        raise ContinuousPaperExecutionBlocked(\n            "legacy terminal is not covered by a valid append-only operator binding: "\n            f"{exc}"\n        ) from exc\n    return verification\n\n\n''',
          )
          replace_once(
              execution,
              '''        _verify_terminal_canonical_binding(\n            terminal=terminal,\n            canonical_ledger_path=canonical_ledger_path,\n        )\n''',
              '''        _verify_terminal_canonical_binding(\n            terminal=terminal,\n            legacy_binding=journal.legacy_binding(payload),\n            canonical_ledger_path=canonical_ledger_path,\n            expected_paper_account_identity_sha256=paper_account_identity_sha256,\n        )\n''',
          )
          replace_once(
              execution,
              '''            _verify_terminal_canonical_binding(\n                terminal=terminal,\n                canonical_ledger_path=config.canonical_ledger_path,\n                expected_target_weights_sha256=pending.target_weights_sha256,\n                expected_paper_account_identity_sha256=(\n                    account_identity.payload_sha256\n                    if dict(terminal.details or {}).get("canonical_prefix_receipt") is not None\n                    else None\n                ),\n            )\n''',
              '''            _verify_terminal_canonical_binding(\n                terminal=terminal,\n                legacy_binding=journal.legacy_binding(pending.payload_sha256),\n                canonical_ledger_path=config.canonical_ledger_path,\n                expected_target_weights_sha256=pending.target_weights_sha256,\n                expected_paper_account_identity_sha256=account_identity.payload_sha256,\n            )\n''',
          )
          replace_once(
              execution,
              '''def reconcile_indeterminate_account(\n    *,\n    config: ContinuousPaperExecutionConfig,\n    as_of_date: str,\n    reason: str,\n) -> list[dict[str, object]]:\n''',
              '''def bind_legacy_terminal_account(\n    *,\n    config: ContinuousPaperExecutionConfig,\n    pending_payload_sha256: str,\n    as_of_date: str,\n    reason: str,\n) -> dict[str, object]:\n    """Append an explicit lower-assurance binding for one legacy terminal.\n\n    This never edits the terminal and never claims an execution-time receipt.\n    Canonical and operational account state must reconcile first. An indeterminate\n    terminal remains economically frozen until ``reconcile_indeterminate_account``\n    separately appends its uncertainty-reconciliation record.\n    """\n\n    with paper_account_lock(config.canonical_ledger_path):\n        return _bind_legacy_terminal_account_locked(\n            config=config,\n            pending_payload_sha256=pending_payload_sha256,\n            as_of_date=as_of_date,\n            reason=reason,\n        )\n\n\ndef _bind_legacy_terminal_account_locked(\n    *,\n    config: ContinuousPaperExecutionConfig,\n    pending_payload_sha256: str,\n    as_of_date: str,\n    reason: str,\n) -> dict[str, object]:\n    binding_reason = str(reason).strip()\n    if not binding_reason:\n        raise ContinuousPaperExecutionBlocked("legacy binding reason must be non-empty")\n    payload = str(pending_payload_sha256).strip()\n    if len(payload) != 64:\n        raise ContinuousPaperExecutionBlocked(\n            "legacy binding requires a 64-character pending payload digest"\n        )\n    as_of = pd.Timestamp(as_of_date).date().isoformat()\n    try:\n        identity = ensure_paper_account_identity(\n            canonical_ledger_path=config.canonical_ledger_path,\n            portfolio_id=config.portfolio_id,\n            initial_cash=config.initial_cash,\n            identity_path=config.account_identity_path,\n        )\n    except PaperAccountIdentityError as exc:\n        raise ContinuousPaperExecutionBlocked(\n            f"paper account identity verification failed: {exc}"\n        ) from exc\n    journal = PendingExecutionJournal(config.execution_journal_path)\n    if not journal.verify():\n        raise ContinuousPaperExecutionBlocked("pending execution journal verification failed")\n    terminal = journal.terminal(payload)\n    if terminal is None:\n        raise ContinuousPaperExecutionBlocked(\n            f"no terminal execution evidence exists for pending payload {payload}"\n        )\n    if dict(terminal.details or {}).get("canonical_prefix_receipt") is not None:\n        raise ContinuousPaperExecutionBlocked(\n            "terminal already carries an original execution-time canonical-prefix receipt"\n        )\n\n    canonical_state = recover_from_canonical(\n        config.canonical_ledger_path,\n        portfolio_id=identity.portfolio_id,\n        initial_cash=identity.initial_cash,\n        as_of_session=as_of,\n    )\n    operational_state = recover(\n        EventLedger(config.operational_ledger_path),\n        portfolio_id=identity.portfolio_id,\n        initial_cash=identity.initial_cash,\n    )\n    _assert_recovered_account_consistent(canonical_state, operational_state)\n    if canonical_state.open_orders() or operational_state.open_orders():\n        raise ContinuousPaperExecutionBlocked(\n            "cannot bind legacy terminal while unresolved open orders remain"\n        )\n\n    target_sha = str(dict(terminal.details or {}).get("target_weights_sha256") or "")\n    if not target_sha:\n        pending = PendingPaperSignalStore(config.pending_signal_dir).read(terminal.signal_date)\n        if pending is not None and pending.payload_sha256 == payload:\n            target_sha = pending.target_weights_sha256\n    if len(target_sha) != 64:\n        raise ContinuousPaperExecutionBlocked(\n            "legacy terminal cannot be safely bound without its exact target digest"\n        )\n    prefix_index = build_canonical_prefix_index(config.canonical_ledger_path)\n    details = {\n        "terminal_record_sha256": terminal.record_sha256,\n        "paper_account_identity_sha256": identity.payload_sha256,\n        "target_weights_sha256": target_sha,\n        "canonical_records": prefix_index.record_count,\n        "canonical_head": prefix_index.current_head,\n        "account_state_sha256": _account_state_sha256(canonical_state),\n        "reconciled_as_of": as_of,\n        "reason": binding_reason,\n        "assurance": "operator_reconciled_legacy_terminal_v1",\n    }\n    existing = journal.legacy_binding(payload)\n    if existing is not None:\n        try:\n            verify_legacy_terminal_binding(\n                terminal,\n                existing,\n                prefix_index=prefix_index,\n                expected_paper_account_identity_sha256=identity.payload_sha256,\n                expected_target_weights_sha256=target_sha,\n            )\n        except LegacyTerminalBindingError as exc:\n            raise ContinuousPaperExecutionBlocked(\n                f"existing legacy terminal binding is invalid: {exc}"\n            ) from exc\n        return existing.to_dict()\n    binding = journal.append(\n        pending_payload_sha256=payload,\n        signal_date=terminal.signal_date,\n        execution_date=terminal.execution_date,\n        status=LEGACY_BINDING_STATUS,\n        details=details,\n    )\n    return binding.to_dict()\n\n\ndef reconcile_indeterminate_account(\n    *,\n    config: ContinuousPaperExecutionConfig,\n    as_of_date: str,\n    reason: str,\n) -> list[dict[str, object]]:\n''',
