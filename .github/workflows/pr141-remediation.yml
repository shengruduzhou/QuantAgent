              '''    if previous_weights is not None and config.max_turnover > 0:\n        # A selected-only hard constraint is valid only when every currently\n        # held name is represented by a CVXPY decision variable. If a holding\n        # dropped from selection, forcing its entire weight into a constant exit\n        # term can make the problem infeasible even though the feasible action is\n        # a *partial* exit. In that case defer the hard turnover bound to the one\n        # coherent current∪desired projection below, which can retain the dropped\n        # holding while moving exactly up to max_turnover.\n        dropped_turnover = float(\n            previous_weights.loc[~previous_weights.index.isin(symbols)].abs().sum()\n        )\n        if dropped_turnover <= 1e-12:\n            constraints.append(cp.norm1(w - prev) <= config.max_turnover)\n''',
